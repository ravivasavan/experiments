  <script>
    /* Set data-theme before paint to avoid FOUC. Cycles: day → night → system
       → circadian. Circadian colours are computed by circadian.js (loaded on
       demand by chrome.js), so re-apply its last cached tokens here to keep
       first paint correct. Also resolve the theme-color meta (mobile browser
       chrome) to match, same logic chrome.js uses at runtime. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'day' && t !== 'night' && t !== 'system' && t !== 'circadian') t = 'system';
      document.documentElement.dataset.theme = t;
      var DAY = '#fff5f5', NIGHT = '#0d1b1e';
      var color = t === 'night' ? NIGHT : DAY;
      if (t === 'system') {
        try {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) color = NIGHT;
        } catch (e) {}
      }
      if (t === 'circadian') {
        try {
          var cache = JSON.parse(localStorage.getItem('circadian-cache'));
          for (var k in cache) document.documentElement.style.setProperty(k, cache[k]);
          if (cache && cache['--bg']) color = cache['--bg'];
        } catch (e) {}
      }
      try {
        var meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', color);
      } catch (e) {}
    })();
  </script>

</head>

<body>
  <div data-chrome></div>

  <!-- The rule marks where the site's chrome ends and this experiment's begins. -->
  <div class="chrome-rule" aria-hidden="true"></div>

  <!-- What you are looking at, down the left. Reveal is what the button was
       called on the remote: it uncovers the control codes rather than changing
       the page, so it rides with the zoom and not in the panel. -->
  <nav class="rail" aria-label="Teletext view">
    <button class="tool-pill" id="p-reveal" type="button" aria-label="Reveal the control codes" aria-pressed="false">
      <span class="tool-pill__icon">
        <svg viewBox="-1.3333 -1.3333 26.6667 26.6667" fill="none" stroke="currentColor" stroke-width="2.2222" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </span>
      <span class="tool-pill__label">Reveal</span>
    </button>
    <!-- Zoom. The stage it acts on is the one [data-pan] on the page, and Fit
         lights up whenever there is something to go back from. -->
    <div class="rail__group rail__group--zoom">
      <button class="tool-pill" type="button" data-view="in" aria-label="Zoom in">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg></span>
        <span class="tool-pill__label">Zoom in</span>
      </button>
      <button class="tool-pill" type="button" data-view="out" aria-label="Zoom out">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg></span>
        <span class="tool-pill__label">Zoom out</span>
      </button>
      <button class="tool-pill" type="button" data-view="fit" aria-label="Fit to the screen">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg></span>
        <span class="tool-pill__label">Fit</span>
      </button>
    </div>
  </nav>

  <!-- What you do to it. The panel holds the page's parameters and nothing
       else (src/main.jsx); the verbs are here, with the selector that belongs
       to Export and the readout the sheet's head used to carry. -->
  <nav class="dock" aria-label="Teletext actions">
    <button class="tool-pill" id="p-random" type="button" aria-label="Randomise the page">
      <span class="tool-pill__icon">
        <svg viewBox="-1.3333 -1.3333 26.6667 26.6667" fill="none" stroke="currentColor" stroke-width="2.2222" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>
        </svg>
      </span>
      <span class="tool-pill__label">Randomise</span>
    </button>
    <!-- The page's body copy: a multi-line field, which DialKit has no control
         for, so it is a bar this pill opens (teletext.css). -->
    <button class="tool-pill" id="p-text" type="button" aria-label="Edit the page copy" aria-expanded="false" aria-controls="text-bar">
      <span class="tool-pill__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/>
        </svg>
      </span>
      <span class="tool-pill__label">Text</span>
    </button>
    <!-- A file chooser is not a dial either. The pill opens the hidden #file
         the script already binds, and a picture can still be dropped anywhere
         on the page. -->
    <button class="tool-pill" id="p-picture" type="button" aria-label="Choose a picture to quantise">
      <span class="tool-pill__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>
        </svg>
      </span>
      <span class="tool-pill__label">Picture</span>
    </button>
    <!-- Only there when there is a picture to clear. -->
    <button class="tool-pill" id="p-clearpic" type="button" aria-label="Clear the picture" hidden>
      <span class="tool-pill__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="2" x2="22" y1="2" y2="22"/><path d="M10.41 10.41a2 2 0 1 1-2.83-2.83"/><line x1="13.5" x2="6" y1="13.5" y2="21"/><line x1="18" x2="21" y1="12" y2="15"/><path d="M3.59 3.59A2 2 0 0 0 3 5v14a2 2 0 0 0 2 2h14a2 2 0 0 0 1.41-.59"/><path d="M21 15V5a2 2 0 0 0-2-2H9"/>
        </svg>
      </span>
      <span class="tool-pill__label">Clear</span>
    </button>
    <button class="tool-pill" id="p-export" type="button" aria-label="Export the page">
      <span class="tool-pill__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
        </svg>
      </span>
      <span class="tool-pill__label">Export</span>
    </button>
    <!-- The format belongs to the verb beside it, not to the page, so it is a
         dock selector: a pill whose whole face is the native <select>. Each
         option fires the hidden button the script already binds. -->
    <label class="tool-pill tool-pill--select" aria-label="Export format">
      <span class="tool-pill__label" id="x-format-label">PNG</span>
      <span class="tool-pill__chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
      <select class="tool-pill__select" id="x-format">
        <option value="x-png">PNG</option>
        <option value="x-tti">TTI</option>
        <option value="x-unicode">Unicode</option>
        <option value="x-edittf">edit.tf</option>
      </select>
    </label>
    <!-- The sheet's head said which page this was; the readout says it now,
         with the scheme's five colours beside it. #sheet-summary and #swatches
         keep their ids, so teletext.js writes and paints exactly where it
         always did. -->
    <p class="readout" aria-live="polite">
      <span id="sheet-summary">…</span>
      <span class="readout__sep">·</span>
      <span id="swatches" aria-label="Scheme colours"></span>
      <span id="caption">…</span>
    </p>
  </nav>

  <main id="stage" data-pan="free">
    <div id="screen-wrap">
      <canvas id="screen" width="480" height="500" role="img"
              aria-label="A teletext page, 40 columns by 25 rows"></canvas>
    </div>
  </main>

  <!-- The copy bar the Text pill opens: the dock's material, the dock's
       width, directly above it. #c-copy keeps its id, so the script's binding
       is the one it always had. -->
  <div class="text-bar" id="text-bar" hidden>
    <textarea class="textarea" id="c-copy" spellcheck="false" aria-label="Page copy"></textarea>
  </div>

  <!-- The controls teletext.js has always read, and nothing looks at. The panel
       is DialKit's popover now (src/main.jsx) and the dock carries the verbs;
       both work by setting an input or clicking a button in here, so the
       script's own wiring is untouched. #drop is still the picture's landing
       place — the pill opens #file, a drop anywhere on the page is forwarded
       to it, and its label is how the dock knows whether there is a picture to
       clear. -->
  <div class="bridge" hidden aria-hidden="true">
    <input class="input" id="c-links" type="text" value="INDEX, MAGNETIC, BLOCK, A-Z">
    <input id="file" type="file" accept="image/*">
    <div id="drop" tabindex="-1">Drop an image, or click to choose</div>
    <button class="btn" id="c-clearimg" type="button">Clear picture</button>
    <button class="btn" id="x-png" type="button">PNG</button>
    <button class="btn" id="x-tti" type="button">TTI</button>
    <button class="btn" id="x-edittf" type="button">Open in edit.tf</button>
    <button class="btn" id="x-unicode" type="button">Copy as Unicode</button>
    <span id="x-note"></span>
  </div>

  <!-- DialKit's own mount. It renders its popover into <body> from here. -->
  <div id="root"></div>

<script src="/assets/play.js" defer></script>
<script src="./teletext.js" defer></script>
<script src="https://ravivasavan.com/chrome/v1/chrome.js" defer
        data-surface="play"
        data-back="https://play.ravivasavan.com"
        data-back-label="Back to Play"></script>
</body>
