  <script>
    /* Set data-theme before paint to avoid FOUC. Cycles: day → night → system
       → circadian. Circadian colours are computed by circadian.js (loaded on
       demand by chrome.js), so re-apply its last cached tokens here to keep
       first paint correct. Also resolve the theme-color meta (mobile browser
       chrome) to match, same logic chrome.js uses at runtime. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'day' && t !== 'night' && t !== 'system' && t !== 'circadian') t = 'system';
      document.documentElement.dataset.theme = t;
      var DAY = '#fff5f5', NIGHT = '#0d1b1e';
      var color = t === 'night' ? NIGHT : DAY;
      if (t === 'system') {
        try {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) color = NIGHT;
        } catch (e) {}
      }
      if (t === 'circadian') {
        try {
          var cache = JSON.parse(localStorage.getItem('circadian-cache'));
          for (var k in cache) document.documentElement.style.setProperty(k, cache[k]);
          if (cache && cache['--bg']) color = cache['--bg'];
        } catch (e) {}
      }
      try {
        var meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', color);
      } catch (e) {}
    })();
  </script>

  <style>
    /* Bedstead by Ben Harris — an outline font generated from the Mullard
       SAA5050 character ROM, reproducing the chip's diagonal-smoothing.
       Released into the public domain. https://bjh21.me.uk/bedstead/
       Its advance is 0.6em and ascent 0.8em, so at font-size 20px a cell is
       exactly 12 × 20 — the SAA5050 raster, with no tracking fixes. */
    @font-face {
      font-family: "Bedstead";
      src: url("/assets/fonts/Bedstead-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    /* ---- the screen ----
       The window doesn't scroll; the stage does, and it is the whole viewport:
       the page is centred on the window's centre and the settings glass floats
       over it. The fit-to-width maths below measures that same box. */
    html, body { height: 100%; overflow: hidden; }
    #stage {
      height: 100%;
      overflow: auto;
      display: grid;
      place-items: center;
      /* No padding: the screen centres on the window itself, and the chrome and
         Tools lie over it like everywhere else. */
      padding: 0;
    }
    #screen-wrap { display: grid; gap: 16px; justify-items: center; }
    /* The page never inverts with the theme: teletext is black, full stop.
       Only the surround follows day/night. */
    #screen {
      display: block;
      background: #000;
      image-rendering: pixelated;
    }

    /* ---- the two controls with no shared shape ----
       Four attributes are one list, not four settings twenty pixels apart. */
    .checks { display: grid; gap: 12px; }
    /* The picture well is a target rather than a field, so it keeps the
       dashed edge it needs to read as one. */
    #drop {
      border: 1px dashed color-mix(in srgb, var(--fg) 24%, transparent);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 160ms ease, color 160ms ease;
    }
    #drop:hover { border-color: color-mix(in srgb, var(--fg) 40%, transparent); color: var(--ink); }
    #drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #drop.over { border-color: var(--accent); color: var(--ink); }
    #file { display: none; }

    /* Folded: the screen takes the width, the sheet drops to the bottom of the
       window (play.css) and the window scrolls again. */
    @media (max-width: 900px) {
      html, body { height: auto; overflow: visible; }
      #stage {
        min-height: 100svh;
        overflow: visible;
        padding: 0 var(--chrome-pad);
      }
    }
    .bridge { display: none; }
  </style>

  <div data-chrome></div>

  <!-- The rule marks where the site's chrome ends and this experiment's begins. -->
  <div class="chrome-rule" aria-hidden="true"></div>

  <!-- Second row: teletext's own buttons, labelled. These two used to be a
       button and a checkbox in the panel; the sheet keeps the settings, the row
       takes the actions, and neither is duplicated. Reveal is what the button
       was called on the remote. -->
  <nav class="rail" aria-label="Teletext view">
    <button class="tool-pill" id="p-reveal" type="button" aria-label="Reveal the control codes" aria-pressed="false">
      <span class="tool-pill__icon">
        <svg viewBox="-1.3333 -1.3333 26.6667 26.6667" fill="none" stroke="currentColor" stroke-width="2.2222" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </span>
      <span class="tool-pill__label">Reveal</span>
    </button>
    <!-- Zoom. The stage it acts on is the one [data-pan] on the page, and Fit
         lights up whenever there is something to go back from. -->
    <div class="rail__group rail__group--zoom">
      <button class="tool-pill" type="button" data-view="in" aria-label="Zoom in">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg></span>
        <span class="tool-pill__label">Zoom in</span>
      </button>
      <button class="tool-pill" type="button" data-view="out" aria-label="Zoom out">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg></span>
        <span class="tool-pill__label">Zoom out</span>
      </button>
      <button class="tool-pill" type="button" data-view="fit" aria-label="Fit to the screen">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg></span>
        <span class="tool-pill__label">Fit</span>
      </button>
    </div>
  </nav>

  <nav class="dock" aria-label="Teletext actions">
    <button class="tool-pill" id="p-random" type="button" aria-label="Randomise the page">
      <span class="tool-pill__icon">
        <svg viewBox="-1.3333 -1.3333 26.6667 26.6667" fill="none" stroke="currentColor" stroke-width="2.2222" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>

    <p class="readout" id="caption" aria-live="polite">…</p>

  <main id="stage" data-pan="free">
    <div id="screen-wrap">
      <canvas id="screen" width="480" height="500" role="img"
              aria-label="A teletext page, 40 columns by 25 rows"></canvas>
    </div>
  </main>

  <!-- The settings float over the page on their own pane of glass. Folded, the
       head is all that stays on screen — which is why it says what the page is
       rather than just "Settings". -->
  <aside class="sheet" id="panel" aria-label="Teletext settings">
    <div class="sheet__head">
      <span class="sheet__title">Teletext</span>
      <span class="sheet__summary" id="sheet-summary">…</span>
    </div>
    <div class="sheet__body">

      <!-- Everything DialKit has a control for is DialKit's, the buttons
           included. What is left below it is what it has none for. -->
      <div id="dial-mount"></div>

      <h2 class="sheet__section">Copy</h2>
      <label class="field">
        <span class="field__top"><span class="field__label">Text</span></span>
        <textarea class="textarea" id="c-copy" spellcheck="false"></textarea>
      </label>

      <h2 class="sheet__section">Palette</h2>
      <div class="swatches" id="swatches"></div>

      <h2 class="sheet__section">Picture</h2>
      <div id="drop" tabindex="0" role="button">Drop an image, or click to choose</div>

      <!-- The buttons DialKit now fires. They stay on the page because they are
           what the script already binds; nothing looks at them. -->
      <div class="bridge" hidden aria-hidden="true">
        <input class="input" id="c-links" type="text" value="INDEX, MAGNETIC, BLOCK, A-Z">
        <input id="file" type="file" accept="image/*">
        <button class="btn" id="c-clearimg" type="button">Clear picture</button>
        <button class="btn" id="x-png" type="button">PNG</button>
        <button class="btn" id="x-tti" type="button">TTI</button>
        <button class="btn" id="x-edittf" type="button">Open in edit.tf</button>
        <button class="btn" id="x-unicode" type="button">Copy as Unicode</button>
        <span id="x-note"></span>
      </div>
    </div>
  </aside>

<!-- DialKit's own mount; teletext's controls render here. -->
  <div id="root"></div>
