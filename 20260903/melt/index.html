  <script>
    /* Set data-theme before paint to avoid FOUC. Cycles: day → night → system
       → circadian. Circadian colours are computed by circadian.js (loaded on
       demand by chrome.js), so re-apply its last cached tokens here to keep
       first paint correct. Also resolve the theme-color meta (mobile browser
       chrome) to match, same logic chrome.js uses at runtime. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'day' && t !== 'night' && t !== 'system' && t !== 'circadian') t = 'system';
      document.documentElement.dataset.theme = t;
      var DAY = '#fff5f5', NIGHT = '#0d1b1e';
      var color = t === 'night' ? NIGHT : DAY;
      if (t === 'system') {
        try {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) color = NIGHT;
        } catch (e) {}
      }
      if (t === 'circadian') {
        try {
          var cache = JSON.parse(localStorage.getItem('circadian-cache'));
          for (var k in cache) document.documentElement.style.setProperty(k, cache[k]);
          if (cache && cache['--bg']) color = cache['--bg'];
        } catch (e) {}
      }
      try {
        var meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', color);
      } catch (e) {}
    })();
  </script>

  <style>
    /* Melt's own half of the page. The type, the tokens, the two chrome rows
       and every control in the sheet come from play.css. */

    html, body { height: 100%; overflow: hidden; }

    /* ---- the stage ---- */
    /* The full viewport — the sheet is a pure overlay that may sit over part
       of the artwork; that's what minimise is for. */
    #stage {
      position: fixed; inset: 0;
      overflow: hidden; touch-action: none;
    }
    #ink { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #stage.over::after {
      content: ''; position: absolute; inset: 12px; border-radius: 18px; pointer-events: none;
      border: 1px dashed color-mix(in srgb, var(--accent) 70%, transparent);
      background: color-mix(in srgb, var(--accent) 6%, transparent);
    }
    #dump { position: absolute; left: 0; top: 0; width: 0; height: 0; object-fit: contain; pointer-events: none; }

    #empty {
      position: absolute; inset: 0; display: grid; place-content: center; justify-items: center;
      gap: 16px; text-align: center; padding: 24px; pointer-events: none;
    }
    #empty > * { pointer-events: auto; }
    #empty h1 { font-size: 34px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; }
    #empty p { font-size: 14px; color: var(--muted); max-width: 34ch; }
    #empty .link { background: none; border: 0; padding: 0; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    #empty .link:hover { color: var(--accent); }
    #fatal { font-size: 14px; color: var(--accent); max-width: 44ch; line-height: 1.45; }

    /* ---- the sheet's own furniture ---- */
    /* Folded, the head is all you see of the sheet, so it carries the count and
       the file: the summary truncates rather than pushing the count off. */
    #ptcount { white-space: nowrap; }
    #n { font-variant-numeric: tabular-nums; }
    #nlabel { color: var(--muted); }
    #status { min-width: 0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }


    /* One melt point: its number, its two dials, and the way out. */
    .bridge { display: none; }
    /* Labil Grotesk ships 400 only, so emphasis is colour, not weight. */
  </style>

<body>
  <div data-chrome></div>
  <div class="chrome-rule" aria-hidden="true"></div>

  <nav class="rail" aria-label="Melt view">
    <!-- Zoom. The stage it acts on is the one [data-pan] on the page, and Fit
         lights up whenever there is something to go back from. -->
    <div class="rail__group rail__group--zoom">
      <button class="tool-pill" type="button" data-view="in" aria-label="Zoom in">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg></span>
        <span class="tool-pill__label">Zoom in</span>
      </button>
      <button class="tool-pill" type="button" data-view="out" aria-label="Zoom out">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg></span>
        <span class="tool-pill__label">Zoom out</span>
      </button>
      <button class="tool-pill" type="button" data-view="fit" aria-label="Fit to the screen">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg></span>
        <span class="tool-pill__label">Fit</span>
      </button>
    </div>
  </nav>

  <nav class="dock" aria-label="Melt actions">
    <button class="tool-pill" id="t-upload" type="button" aria-label="Upload an SVG">
      <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg></span>
      <span class="tool-pill__label">Upload</span>
    </button>
    <button class="tool-pill tool-pill--danger" id="t-clear" type="button" disabled aria-label="Remove all melt points">
      <span class="tool-pill__icon"><svg viewBox="-1.3333 -1.3333 26.6667 26.6667" fill="none" stroke="currentColor" stroke-width="2.2222" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></span>
      <span class="tool-pill__label">Clear</span>
    </button>
    <button class="tool-pill" id="t-export" type="button" disabled aria-label="Download the melt as an SVG">
      <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg></span>
      <span class="tool-pill__label">Export</span>
    </button>
  </nav>

  <!-- The picker the Upload pills open. It lives outside both bars: it is not a
       control in either of them, it is the file dialog they reach for. -->
  <input type="file" id="file" accept=".svg,image/svg+xml" hidden>

  <!-- Before is a way of looking, not a verb, so it is a toggle in the panel.
       The button stays on the page because it is what every binding already
       talks to — the click handler, the is-on class, and the B key you can hold
       down to peek. The panel clicks it. -->
  <div class="bridge" hidden aria-hidden="true">
    <button class="tool-pill" id="t-before" type="button" aria-pressed="false" disabled aria-label="Show the unmelted source">
      <span class="tool-pill__icon"><svg viewBox="-1.3333 -1.3333 26.6667 26.6667" fill="none" stroke="currentColor" stroke-width="2.2222" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></span>
      <span class="tool-pill__label">Before</span>
    </button>
  </div>

  <main id="stage" aria-label="Melt stage" data-pan>
    <canvas id="ink"></canvas>
    <img id="dump" alt="" decoding="async" hidden>
    <div id="empty">
      <h1>Drop an SVG here</h1>
      <p id="fatal" hidden></p>
      <button class="tool-pill" id="e-upload" type="button">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg></span>
        <span class="tool-pill__label">Upload</span>
      </button>
      <button class="link" id="e-sample" type="button">or try the sample</button>
    </div>
  </main>

  <aside class="sheet" aria-label="Melt settings">
    <div class="sheet__head">
      <span class="sheet__title" id="ptcount">Melt · <span id="n">0</span> <span id="nlabel">melt points</span></span>
      <span class="sheet__summary" id="status" aria-live="polite">Drop an SVG to start</span>
    </div>
    <div class="sheet__body">

      <!-- All of it is DialKit's: the global dials, the Before toggle, and a
           folder per melt point rebuilt as points come and go. -->
      <div id="dial-mount"></div>

    </div>
  </aside>

  <div id="root"></div>
