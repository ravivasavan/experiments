<!doctype html>

<head>

  <meta name="theme-color" id="theme-color" content="#fff5f5">
  <script>
    /* Set data-theme and the address-bar colour before paint, to avoid a
       flash. Cycles: day → night → system → circadian. Circadian colours are
       computed by circadian.js, which play.js only loads when it's wanted, so
       its last cached tokens are re-applied here to keep first paint right. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'day' && t !== 'night' && t !== 'system' && t !== 'circadian') t = 'system';
      document.documentElement.dataset.theme = t;
      var c = '#fff5f5';
      if (t === 'night') c = '#0d1b1e';
      else if (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) c = '#0d1b1e';
      else if (t === 'circadian') {
        try {
          var cache = JSON.parse(localStorage.getItem('circadian-cache'));
          for (var k in cache) document.documentElement.style.setProperty(k, cache[k]);
          if (cache && cache['--bg']) c = cache['--bg'];
        } catch (e) {}
      }
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', c);
    })();
  </script>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/LabilGrotesk-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/play.css">
  <style>
    /* Page-specific only — the tokens, the chrome, the sheet and every control
       live in /assets/play.css, and the DialKit skin ships with the bundle. */

    html, body { height: 100%; overflow: hidden; }

    /* The world is full-bleed and pans under the glass: that is the point of a
       translucent sheet. App.jsx centres the world on the viewport's centre,
       and the sheet lies over the right of it — minimise is the way back. */      width: 110px;
      aspect-ratio: 1400 / 800;
      border: 1px solid var(--separator);
    }

    @media (max-width: 900px) {
      /* Folded, the sheet is a bar across the bottom and, minimised, a disc in
         the bottom-right corner: the dock lifts to sit on that bar, and
         the patch test lifts clear of the dock in turn — still on the left
         edge, which the disc never reaches. */
  </style>
  <!-- Before the app bundle, which Vite injects at the end of this head. -->
  <script src="/assets/play.js" defer></script>
</head>
<body>
  <!-- Top row, site level: back left, identity centred, theme hard right. -->
  <div class="chrome">
    <a class="icon-pill chrome__back" href="/" aria-label="Back to play index">
      <span class="icon-pill__icon">
        <svg viewBox="4 4 16 16" fill="none" stroke="currentColor" stroke-width="1.3333" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </span>
    </a>
    <header class="header-pill chrome__id">
      <div class="header-pill__inner">
        <div class="header-pill__avatar">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"> <rect width="2.00001" height="2.00001" transform="matrix(-1 0 0 1 32 13)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 20 13)" fill="currentColor"/> <path d="M34.0098 34.9766V48H36V34.9766H34.0098ZM13.9902 34.9766H12V48H13.9902V35.0293H15.9805V32.9814H13.9902V34.9766ZM32 13H16V9H14V17H16V15H32V25H30V27H18V31H16V33H18V35H30V33H32V35H34V33H32V31H34V15H40V13H34V9H32V13ZM12 22H14V17H12V22ZM28 21H30V19H28V21ZM20 21H22V19H20V21ZM30 9H32V7H30V9ZM16 9H18V7H16V9ZM18 7H30V5H18V7Z" fill="currentColor"/> <rect width="4" height="6" transform="matrix(-1 0 0 1 18 27)" fill="currentColor"/> <rect width="2.00001" height="4.00001" transform="matrix(-1 0 0 1 16 21)" fill="currentColor"/> <path d="M16 25H18V21H16V25Z" fill="currentColor"/> <rect width="16.0001" height="2.00001" transform="matrix(-1 0 0 1 30 25)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 32 23)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 24 23)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 28 21)" fill="currentColor"/> </svg>
        </div>
        <div class="header-pill__label">
          <span class="header-pill__name">Ravi Vasavan</span>
          <span class="header-pill__role">Metal</span>
        </div>
      </div>
    </header>
    <button class="icon-pill icon-pill--theme chrome__theme" type="button" aria-label="Toggle theme" data-theme-toggle>
      <span class="icon-pill__icon">
        <svg data-tstate="day" viewBox="-1.3333 -1.3333 26.6667 26.6667" fill="none" stroke="currentColor" stroke-width="2.2222" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
        <svg data-tstate="night" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
        <svg data-tstate="system" viewBox="-1.3333 -1.3333 26.6667 26.6667" fill="none" stroke="currentColor" stroke-width="2.2222" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>
        </svg>
        <svg data-tstate="circadian" viewBox="-1.3333 -1.3333 26.6667 26.6667" fill="none" stroke="currentColor" stroke-width="2.2222" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
      </span>
    </button>
  </div>

  <!-- The rule marks where the site's chrome ends and this experiment's begins. -->
  <div class="chrome-rule" aria-hidden="true"></div>

  <!-- Second row: metal's own buttons. Single shows one variant large;
       Spawn breeds nine from the selected; Fresh starts over at the current
       legibility stop; Back walks the lineage; Export saves the vector. -->
  <!-- What you are looking at: the view toggle and the step back through the
       broods. Icon only in the rail; each keeps its label for a reader. -->
  <!-- The one thing that changes what you are looking at: the walk back. -->
  <nav class="rail" aria-label="Metal history">
    <button class="tool-pill" id="p-back" type="button" aria-label="Back to the previous brood">
      <span class="tool-pill__icon">
        <svg viewBox="1.3333 1.3333 21.3333 21.3333" fill="none" stroke="currentColor" stroke-width="1.7778" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
      </span>
      <span class="tool-pill__label">Back</span>
    </button>
    <div class="rail__group rail__group--zoom">
      <button class="tool-pill" id="p-in" type="button" aria-label="Zoom in">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg></span>
        <span class="tool-pill__label">Zoom in</span>
      </button>
      <button class="tool-pill" id="p-out" type="button" aria-label="Zoom out">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg></span>
        <span class="tool-pill__label">Zoom out</span>
      </button>
      <button class="tool-pill" id="p-fit" type="button" aria-label="Fit to the screen">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg></span>
        <span class="tool-pill__label">Fit</span>
      </button>
    </div>
  </nav>

  <!-- What you do to it. -->
  <nav class="dock" aria-label="Metal actions">
    <button class="tool-pill" id="p-mutate" type="button" aria-label="Mutate this logo">
      <span class="tool-pill__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>
        </svg>
      </span>
      <span class="tool-pill__label">Mutate</span>
    </button>
    <button class="tool-pill" id="p-grow" type="button" aria-label="Re-roll every growth dial">
      <span class="tool-pill__icon">
        <svg viewBox="-1.3333 -1.3333 26.6667 26.6667" fill="none" stroke="currentColor" stroke-width="2.2222" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22V8"/><path d="M12 8c0-3 2-6 6-6 0 4-2 6-6 6z"/><path d="M12 12c0-3-2-6-6-6 0 4 2 6 6 6z"/><path d="M8 22h8"/>
        </svg>
      </span>
      <span class="tool-pill__label">Grow</span>
    </button>
    <button class="tool-pill" id="p-fresh" type="button" aria-label="Start a fresh brood">
      <span class="tool-pill__icon">
        <svg viewBox="1.3333 1.3333 21.3333 21.3333" fill="none" stroke="currentColor" stroke-width="1.7778" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>
        </svg>
      </span>
      <span class="tool-pill__label">Fresh</span>
    </button>
    <button class="tool-pill" id="p-export" type="button" aria-label="Export the selected logo as SVG">
      <span class="tool-pill__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
        </svg>
      </span>
      <span class="tool-pill__label">Export</span>
    </button>
  </nav>

  <div id="root"></div>

  <!-- The settings sheet. It is static markup so play.js finds it at
       DOMContentLoaded and gives it the phone behaviour; React fills the body
       with the DialKit panel once it mounts. -->
  <aside class="sheet" aria-label="Settings">
    <div class="sheet__head">
      <span class="sheet__title">Metal Logo</span>
      <span class="sheet__summary" id="p-summary">Breaking point</span>
    </div>
    <div class="sheet__body" id="dial-mount"></div>
  </aside>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
