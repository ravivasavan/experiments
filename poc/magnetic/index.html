  <meta name="theme-color" id="theme-color" content="#fff5f5">
  <script>
    /* Set data-theme and the address-bar colour before paint, to avoid a
       flash. Cycles: day → night → system → circadian. Circadian colours are
       computed by circadian.js, which play.js only loads when it's wanted, so
       its last cached tokens are re-applied here to keep first paint right. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'day' && t !== 'night' && t !== 'system' && t !== 'circadian') t = 'system';
      document.documentElement.dataset.theme = t;
      var c = '#fff5f5';
      if (t === 'night') c = '#0d1b1e';
      else if (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) c = '#0d1b1e';
      else if (t === 'circadian') {
        try {
          var cache = JSON.parse(localStorage.getItem('circadian-cache'));
          for (var k in cache) document.documentElement.style.setProperty(k, cache[k]);
          if (cache && cache['--bg']) c = cache['--bg'];
        } catch (e) {}
      }
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', c);
    })();
  </script>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/LabilGrotesk-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/play.css">
  <style>
    /* Page-specific only — chrome, tokens, reset and controls all live in
       play.css now. */
    html, body { height: 100%; overflow: hidden; }
    body {
      touch-action: none;
      overscroll-behavior: none;
    }

    /* Window chrome tone — this experiment's own token, distinct from the
       site's --bg/--fg: it's the colour of the little title bars, not the
       page background. */
    :root { --chrome: #ffffff; }
    :root[data-theme="night"] { --chrome: #16282d; }
    @media (prefers-color-scheme: dark) {
      :root[data-theme="system"] { --chrome: #16282d; }
    }

    #stage {
      position: fixed;
      inset: 0;
      cursor: pointer;
    }

    .win {
      position: absolute;
      left: 0;
      top: 0;
      overflow: hidden; /* clips bar + screen to the rounded corners */
      background: var(--chrome);
      box-shadow:
        0 1px 2px rgba(0,0,0,0.10),
        0 8px 24px rgba(0,0,0,0.14);
      will-change: transform;
      backface-visibility: hidden;
      cursor: grab;
    }
    .win.dragging { cursor: grabbing; }
    /* chrome tone variants — silver, graphite, warm, plain */
    .win.c1 { background: color-mix(in oklab, var(--chrome), #9a9a9a 22%); }
    .win.c2 { background: color-mix(in oklab, var(--chrome), var(--night) 14%); }
    .win.c3 { background: color-mix(in oklab, var(--chrome), #efccc4 20%); }

    .screen {
      position: absolute;
      overflow: hidden;
      background: #10181a;
      pointer-events: none;
    }
    .screen .media {
      position: absolute;
      background-size: cover;
      background-position: center;
    }
    .screen video {
      position: absolute;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      display: flex;
      align-items: center;
    }
    .bar .x {
      background: color-mix(in oklab, var(--muted), transparent 40%);
      border: none;
      border-radius: 50%;
      width: 8px;
      height: 8px;
      padding: 0;
      margin-left: 8px;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      transition: background-color 0.15s ease, scale 0.15s ease;
    }
    .bar .x::after { content: ""; position: absolute; inset: -10px; }
    .bar .x:hover { background: var(--orange); scale: 1.15; }

    #hint {
      position: fixed;
      /* Clear of the dock, which centres on the same bottom edge: --panel-gap
         plus the 44px pill plus a gap. */
      bottom: 76px;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--muted);
      pointer-events: none;
      z-index: 500;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    #hint.gone { opacity: 0; }

    #file { display: none; }
  </style>
</head>
<body>
  <div class="chrome">
    <a class="icon-pill chrome__back" href="/" aria-label="Back to play index">
      <span class="icon-pill__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </span>
    </a>
    <header class="header-pill chrome__id">
      <div class="header-pill__inner">
        <div class="header-pill__avatar">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"> <rect width="2.00001" height="2.00001" transform="matrix(-1 0 0 1 32 13)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 20 13)" fill="currentColor"/> <path d="M34.0098 34.9766V48H36V34.9766H34.0098ZM13.9902 34.9766H12V48H13.9902V35.0293H15.9805V32.9814H13.9902V34.9766ZM32 13H16V9H14V17H16V15H32V25H30V27H18V31H16V33H18V35H30V33H32V35H34V33H32V31H34V15H40V13H34V9H32V13ZM12 22H14V17H12V22ZM28 21H30V19H28V21ZM20 21H22V19H20V21ZM30 9H32V7H30V9ZM16 9H18V7H16V9ZM18 7H30V5H18V7Z" fill="currentColor"/> <rect width="4" height="6" transform="matrix(-1 0 0 1 18 27)" fill="currentColor"/> <rect width="2.00001" height="4.00001" transform="matrix(-1 0 0 1 16 21)" fill="currentColor"/> <path d="M16 25H18V21H16V25Z" fill="currentColor"/> <rect width="16.0001" height="2.00001" transform="matrix(-1 0 0 1 30 25)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 32 23)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 24 23)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 28 21)" fill="currentColor"/> </svg>
        </div>
        <div class="header-pill__label">
          <span class="header-pill__name">Ravi Vasavan</span>
          <span class="header-pill__role">Magnetic</span>
        </div>
      </div>
    </header>
    <button class="icon-pill icon-pill--theme chrome__theme" type="button" aria-label="Toggle theme" data-theme-toggle>
      <span class="icon-pill__icon">
        <svg data-tstate="day" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
        <svg data-tstate="night" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
        <svg data-tstate="system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>
        </svg>
        <svg data-tstate="circadian" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
      </span>
    </button>
  </div>

  <!-- The rule marks where the site's chrome ends and this experiment's begins. -->
  <div class="chrome-rule" aria-hidden="true"></div>

  <!-- Second row: magnetic's own buttons, labelled. No sheet — these four
       pills are all the control this experiment needs. -->
  <nav class="rail" aria-label="Magnetic source">
    <button class="tool-pill" id="btn-camera" type="button" aria-label="Use camera">
      <span class="tool-pill__icon">
        <svg data-state="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>
        </svg>
        <svg data-state="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="2" x2="22" y1="2" y2="22"/><path d="M7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16"/><path d="M9.5 4h5L17 7h3a2 2 0 0 1 2 2v7.5"/><path d="M14.121 15.121A3 3 0 1 1 9.88 10.88"/>
        </svg>
      </span>
      <span class="tool-pill__label">Camera</span>
    </button>
  </nav>

  <nav class="dock" aria-label="Magnetic actions">
    <button class="tool-pill" id="btn-upload" type="button" aria-label="Upload image">
      <span class="tool-pill__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>
        </svg>
      </span>
      <span class="tool-pill__label">Upload</span>
    </button>
    <button class="tool-pill" id="btn-snap" type="button" hidden aria-label="Snap photo">
      <span class="tool-pill__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path d="m14.31 8 5.74 9.94"/><path d="M9.69 8h11.48"/><path d="m7.38 12 5.74-9.94"/><path d="M9.69 16 3.95 6.06"/><path d="M14.31 16H2.83"/><path d="m16.62 12-5.74 9.94"/>
        </svg>
      </span>
      <span class="tool-pill__label">Snap</span>
    </button>
    <button class="tool-pill" id="btn-shuffle" type="button" aria-label="Shuffle layout">
      <span class="tool-pill__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>
        </svg>
      </span>
      <span class="tool-pill__label">Shuffle</span>
    </button>
  </nav>

  <div id="stage" data-pan></div>
  <p id="hint">click anywhere to magnetise</p>
  <input id="file" type="file" accept="image/*">

  <!-- The dials drawer. Static markup so play.js finds it at DOMContentLoaded
       and gives it the fold and the minimise disc; React fills the body with
       the DialKit panel once it mounts. -->
  <aside class="sheet" aria-label="Magnetic settings">
    <div class="sheet__head">
      <span class="sheet__title">Magnetic</span>
      <span class="sheet__summary" id="m-summary">16 tiles</span>
    </div>
    <div class="sheet__body" id="dial-mount"></div>
  </aside>

  <div id="root"></div>

<!-- magnetic.js first: it owns the state the panel opens on. A classic defer
     script and a module both run after parsing, in document order. -->
<script src="/assets/play.js" defer></script>
<script src="./magnetic.js" defer></script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
