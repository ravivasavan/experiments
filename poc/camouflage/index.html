  <meta name="theme-color" id="theme-color" content="#fff5f5">
  <script>
    /* Set data-theme before paint to avoid FOUC. Cycles: day → night → system
       → circadian. Circadian colours are computed by circadian.js (loaded on
       demand by chrome.js), so re-apply its last cached tokens here to keep
       first paint correct. Also resolve the theme-color meta (mobile browser
       chrome) to match, same logic chrome.js uses at runtime. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'day' && t !== 'night' && t !== 'system' && t !== 'circadian') t = 'system';
      document.documentElement.dataset.theme = t;
      var DAY = '#fff5f5', NIGHT = '#0d1b1e';
      var color = t === 'night' ? NIGHT : DAY;
      if (t === 'system') {
        try {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) color = NIGHT;
        } catch (e) {}
      }
      if (t === 'circadian') {
        try {
          var cache = JSON.parse(localStorage.getItem('circadian-cache'));
          for (var k in cache) document.documentElement.style.setProperty(k, cache[k]);
          if (cache && cache['--bg']) color = cache['--bg'];
        } catch (e) {}
      }
      try {
        var meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', color);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="/assets/play.css">
  <style>
    /* Camouflage's own half of the page: the stage the pattern fills and the
       seed chip that sits on it. The type, the tokens, both chrome rows, the
       glass and every control in the sheet come from play.css. */

    html, body { height: 100%; overflow: hidden; }

    /* ---- the stage ---- */
    /* The pattern is a full-bleed background: the stage is the whole viewport,
       centred under the chrome, and the sheet floats above it as an overlay
       rather than carving out room. camo.js measures this box rather than the
       window, but the two now agree — neither the sheet nor its minimised disc
       ever shifts or crops the pattern. */
    #stage {
      position: fixed; inset: 0;
      overflow: hidden;
    }
    #camo { display: block; width: 100%; height: 100%; }

    /* ---- the seed ---- */
    /* Eight hex digits is the whole state of a pattern, so it stays on screen
       rather than folding away with the sheet. It lies over the camouflage, so
       it needs the same glass under it as everything else does. */
    /* The seed is a readout, not a control, but the bottom edge is the dock's
       now — so it rides in the dock as a chip rather than floating beside it
       and fighting it for the corner at every width. */
    .seed {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 14px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-edge), var(--glass-specular);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .seed__label { color: color-mix(in srgb, var(--ink) 55%, transparent); }

  </style>
</head>
<body>
  <div data-chrome></div>
  <div class="chrome-rule" aria-hidden="true"></div>

  <!-- The verbs live in the dock at the bottom edge. Camouflage has exactly
       one and no view modes, so it gets no left rail. -->
  <nav class="dock" aria-label="Camouflage actions">
    <button class="tool-pill" id="p-random" type="button" aria-label="Generate a new camouflage pattern">
      <span class="tool-pill__icon">
        <svg viewBox="-1.3333 -1.3333 26.6667 26.6667" fill="none" stroke="currentColor" stroke-width="2.2222" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>
        </svg>
      </span>
      <span class="tool-pill__label">Random</span>
    </button>
    <p class="seed" aria-live="polite"><span class="seed__label">Seed</span><span id="seed">--------</span></p>
  </nav>

  <main id="stage" aria-label="Camouflage pattern">
    <canvas id="camo" role="img" aria-label="A generated camouflage pattern"></canvas>
  </main>

  <!-- The dials drawer. Static markup so play.js finds it at DOMContentLoaded
       and gives it the fold and the minimise disc; React fills the body with
       the DialKit panel once it mounts. -->
  <aside class="sheet" aria-label="Camouflage settings">
    <div class="sheet__head">
      <span class="sheet__title">Camouflage</span>
      <span class="sheet__summary" id="p-summary">Woodland &middot; Blotch</span>
    </div>
    <div class="sheet__body" id="dial-mount"></div>
  </aside>

  <div id="root"></div>

<!-- camo.js first: it parses the hash and owns the state the panel opens on.
     A classic defer script and a module both run after parsing, in document
     order, so the engine is ready before React asks it anything. -->
<script src="/assets/play.js" defer></script>
<script src="https://ravivasavan.com/chrome/v1/chrome.js" defer
        data-surface="play"
        data-back="https://play.ravivasavan.com"
        data-back-label="Back to Play"></script>
<script src="./camo.js" defer></script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
