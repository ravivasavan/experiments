  <meta name="theme-color" id="theme-color" content="#fff5f5">
  <script>
    /* Set data-theme before paint to avoid FOUC. Cycles: day → night → system
       → circadian. Circadian colours are computed by circadian.js (loaded on
       demand by chrome.js), so re-apply its last cached tokens here to keep
       first paint correct. Also resolve the theme-color meta (mobile browser
       chrome) to match, same logic chrome.js uses at runtime. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'day' && t !== 'night' && t !== 'system' && t !== 'circadian') t = 'system';
      document.documentElement.dataset.theme = t;
      if (location.search.indexOf('layer=1') !== -1) document.documentElement.dataset.playEmbed = 'layer';
      var DAY = '#fff5f5', NIGHT = '#0d1b1e';
      var color = t === 'night' ? NIGHT : DAY;
      if (t === 'system') {
        try {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) color = NIGHT;
        } catch (e) {}
      }
      if (t === 'circadian') {
        try {
          var cache = JSON.parse(localStorage.getItem('circadian-cache'));
          for (var k in cache) document.documentElement.style.setProperty(k, cache[k]);
          if (cache && cache['--bg']) color = cache['--bg'];
        } catch (e) {}
      }
      try {
        var meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', color);
      } catch (e) {}
    })();
  </script>

  </div>

<p class="readout" id="work-name" data-dock-group="name" tabindex="-1" hidden></p><button class="tool-pill tool-pill--icon" id="previous" data-dock-group="navigation" type="button" aria-label="Previous image" title="Previous image" hidden><span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></span><span class="tool-pill__label">Previous image</span></button><p class="readout" id="work-count" data-dock-group="navigation" role="status" aria-live="polite" aria-atomic="true" hidden></p><button class="tool-pill tool-pill--icon" id="next" data-dock-group="navigation" type="button" aria-label="Next image" title="Next image" hidden><span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span><span class="tool-pill__label">Next image</span></button><button class="tool-pill tool-pill--icon" hidden type="button" data-view="out" data-dock-group="zoom" aria-label="Zoom out">

<button class="tool-pill" id="playback" data-dock-group="playback" type="button" aria-label="Pause" hidden><span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></span><span class="tool-pill__label">Pause</span></button>
