  <script>
    /* Set data-theme before paint to avoid FOUC. Cycles: day → night → system
       → circadian. Circadian colours are computed by circadian.js (loaded on
       demand by chrome.js), so re-apply its last cached tokens here to keep
       first paint correct. Also resolve the theme-color meta (mobile browser
       chrome) to match, same logic chrome.js uses at runtime. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'day' && t !== 'night' && t !== 'system' && t !== 'circadian') t = 'system';
      document.documentElement.dataset.theme = t;
      var DAY = '#fff5f5', NIGHT = '#0d1b1e';
      var color = t === 'night' ? NIGHT : DAY;
      if (t === 'system') {
        try {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) color = NIGHT;
        } catch (e) {}
      }
      if (t === 'circadian') {
        try {
          var cache = JSON.parse(localStorage.getItem('circadian-cache'));
          for (var k in cache) document.documentElement.style.setProperty(k, cache[k]);
          if (cache && cache['--bg']) color = cache['--bg'];
        } catch (e) {}
      }
      try {
        var meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', color);
      } catch (e) {}
    })();
  </script>

  <style>
    /* Page-specific only — chrome, tokens, reset and controls all live in
       play.css now. */
    html, body { height: 100%; overflow: hidden; }
    body {
      touch-action: none;
      overscroll-behavior: none;
    }

    /* Window chrome tone — this experiment's own token, distinct from the
       site's --bg/--fg: it's the colour of the little title bars, not the
       page background. */
    :root { --chrome: #ffffff; }
    :root[data-theme="night"] { --chrome: #16282d; }
    @media (prefers-color-scheme: dark) {
      :root[data-theme="system"] { --chrome: #16282d; }
    }

    #stage {
      position: fixed;
      inset: 0;
      cursor: pointer;
    }

    .win {
      position: absolute;
      left: 0;
      top: 0;
      overflow: hidden; /* clips bar + screen to the rounded corners */
      background: var(--chrome);
      box-shadow:
        0 1px 2px rgba(0,0,0,0.10),
        0 8px 24px rgba(0,0,0,0.14);
      will-change: transform;
      backface-visibility: hidden;
      cursor: grab;
    }
    .win.dragging { cursor: grabbing; }
    /* chrome tone variants — silver, graphite, warm, plain */
    .win.c1 { background: color-mix(in oklab, var(--chrome), #9a9a9a 22%); }
    .win.c2 { background: color-mix(in oklab, var(--chrome), var(--night) 14%); }
    .win.c3 { background: color-mix(in oklab, var(--chrome), #efccc4 20%); }

    .screen {
      position: absolute;
      overflow: hidden;
      background: #10181a;
      pointer-events: none;
    }
    .screen .media {
      position: absolute;
      background-size: cover;
      background-position: center;
    }
    .screen video {
      position: absolute;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      display: flex;
      align-items: center;
    }
    .bar .x {
      background: color-mix(in oklab, var(--muted), transparent 40%);
      border: none;
      border-radius: 50%;
      width: 8px;
      height: 8px;
      padding: 0;
      margin-left: 8px;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      transition: background-color 0.15s ease, scale 0.15s ease;
    }
    .bar .x::after { content: ""; position: absolute; inset: -10px; }
    .bar .x:hover { background: var(--orange); scale: 1.15; }

    #hint {
      position: fixed;
      /* Clear of the dock, which centres on the same bottom edge: --panel-gap
         plus the 44px pill plus a gap. */
      bottom: 76px;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--muted);
      pointer-events: none;
      z-index: 500;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    #hint.gone { opacity: 0; }

    #file { display: none; }
  </style>

        <svg data-state="off" viewBox="-1.3333 -1.3333 26.6667 26.6667" fill="none" stroke="currentColor" stroke-width="2.2222" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="2" x2="22" y1="2" y2="22"/><path d="M7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16"/><path d="M9.5 4h5L17 7h3a2 2 0 0 1 2 2v7.5"/><path d="M14.121 15.121A3 3 0 1 1 9.88 10.88"/>

      </span>
      <span class="tool-pill__label">Camera</span>
    </button>

      <button class="tool-pill" type="button" data-view="in" aria-label="Zoom in">

        <span class="tool-pill__label">Zoom in</span>
      </button>
      <button class="tool-pill" type="button" data-view="out" aria-label="Zoom out">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg></span>

        <span class="tool-pill__label">Fit</span>

    </div>
  </nav>

          <circle cx="12" cy="12" r="10"/><path d="m14.31 8 5.74 9.94"/><path d="M9.69 8h11.48"/><path d="m7.38 12 5.74-9.94"/><path d="M9.69 16 3.95 6.06"/><path d="M14.31 16H2.83"/><path d="m16.62 12-5.74 9.94"/>

      <span class="tool-pill__label">Shuffle</span>
    </button>

  <div id="stage" data-pan></div>
  <p id="hint">click anywhere to magnetise</p>
  <input id="file" type="file" accept="image/*">

  <!-- The dials drawer. Static markup so play.js finds it at DOMContentLoaded
       and gives it the fold and the minimise disc; React fills the body with
       the DialKit panel once it mounts. -->
  <aside class="sheet" aria-label="Magnetic settings">
    <div class="sheet__head">
      <span class="sheet__title">Magnetic</span>
      <span class="sheet__summary" id="m-summary">16 tiles</span>
    </div>
    <div class="sheet__body" id="dial-mount"></div>
  </aside>

  <div id="root"></div>

<!-- magnetic.js first: it owns the state the panel opens on. A classic defer
     script and a module both run after parsing, in document order. -->
