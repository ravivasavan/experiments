  <script>
    /* Set data-theme before paint to avoid FOUC. Cycles: day → night → system
       → circadian. Circadian colours are computed by circadian.js (loaded on
       demand by chrome.js), so re-apply its last cached tokens here to keep
       first paint correct. Also resolve the theme-color meta (mobile browser
       chrome) to match, same logic chrome.js uses at runtime. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'day' && t !== 'night' && t !== 'system' && t !== 'circadian') t = 'system';
      document.documentElement.dataset.theme = t;
      var DAY = '#fff5f5', NIGHT = '#0d1b1e';
      var color = t === 'night' ? NIGHT : DAY;
      if (t === 'system') {
        try {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) color = NIGHT;
        } catch (e) {}
      }
      if (t === 'circadian') {
        try {
          var cache = JSON.parse(localStorage.getItem('circadian-cache'));
          for (var k in cache) document.documentElement.style.setProperty(k, cache[k]);
          if (cache && cache['--bg']) color = cache['--bg'];
        } catch (e) {}
      }
      try {
        var meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', color);
      } catch (e) {}
    })();
  </script>

      </button>

        <span class="tool-pill__label">Gizmo</span>
      </button>
    </div>
    <div class="rail__group rail__group--zoom">
      <button class="tool-pill" type="button" data-view="in" aria-label="Zoom in">
        <span class="tool-pill__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg></span>

  <!-- The stage pans on the middle button or with space held: a plain drag on
       the mark is depth.js's, and turns the d. The icon lineup is a column of
       cards beside the rail and the canvas centres in what is left (a Depth
       exception; see AGENTS.md). -->
  <main class="viewport" aria-label="Depth preview">
    <div id="stage" class="stage" data-pan>
      <div id="mark-box" class="mark-box">
        <svg id="mark" tabindex="0" role="img" aria-label="The depthcore d in its frame; E to move, R to rotate; drag the gizmo or the canvas, or use the arrow keys">
          <rect id="mark-field"/>
          <path id="mark-frame" fill-rule="evenodd"/>
          <path id="mark-d"/>
          <g id="gimbal" class="gimbal"></g>
        </svg>
      </div>
    </div>
    <!-- The icons, cut live from the canvas, each at the size a screen shows
         it, drawn at the screen's own pixels. Outside the stage, so zooming
         the canvas leaves them at 1:1. -->

      <figure class="card">
        <canvas class="tile--squircle" data-icon="180" aria-hidden="true"></canvas>
        <figcaption>App icon · 180</figcaption>
      </figure>
      <figure class="card">
        <canvas class="tile--circle" data-icon="128" aria-hidden="true"></canvas>
        <figcaption>Circle · 128</figcaption>
      </figure>
      <figure class="card">
        <div class="card__row">
          <canvas data-icon="64" data-shape="favicon" aria-hidden="true"></canvas>
          <canvas data-icon="48" data-shape="favicon" aria-hidden="true"></canvas>
          <canvas data-icon="32" data-shape="favicon" aria-hidden="true"></canvas>
          <canvas data-icon="16" data-shape="favicon" aria-hidden="true"></canvas>
        </div>
        <figcaption>Favicon · 64 · 48 · 32 · 16</figcaption>
      </figure>
      <figure class="card">
        <div class="card__row">

        </div>
        <figcaption>Pixels · 16 · 32</figcaption>
      </figure>
    </section>
  </main>
